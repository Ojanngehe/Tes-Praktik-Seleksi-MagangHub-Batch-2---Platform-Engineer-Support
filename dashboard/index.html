<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard Status Container</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --green: #3fb950;
        --red: #f85149;
        --amber: #d29922;
        --blue: #58a6ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      header {
        padding: 20px 28px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }
      header h1 {
        font-size: 20px;
        margin: 0;
      }
      header .sub {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }
      .controls {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      button {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 14px;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover {
        border-color: var(--blue);
      }
      #status {
        color: var(--muted);
        font-size: 13px;
      }
      main {
        padding: 24px 28px;
      }
      .env-group {
        margin-bottom: 28px;
      }
      .env-group h2 {
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 12px;
      }
      .env-group h2 .count {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 1px 10px;
        font-size: 12px;
      }
      .env-badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
      }
      .env-production {
        background: rgba(88, 166, 255, 0.15);
        color: var(--blue);
      }
      .env-staging {
        background: rgba(210, 153, 34, 0.15);
        color: var(--amber);
      }
      .env-unknown {
        background: rgba(139, 148, 158, 0.15);
        color: var(--muted);
      }
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 14px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
      }
      .card.broken {
        border-color: var(--red);
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .card-head .name {
        font-weight: 600;
        font-size: 15px;
        word-break: break-all;
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
      }
      .st-running {
        background: rgba(63, 185, 80, 0.15);
        color: var(--green);
      }
      .st-exited,
      .st-dead,
      .st-paused {
        background: rgba(248, 81, 73, 0.15);
        color: var(--red);
      }
      .st-restarting {
        background: rgba(210, 153, 34, 0.15);
        color: var(--amber);
      }
      .st-created {
        background: rgba(139, 148, 158, 0.15);
        color: var(--muted);
      }
      .row {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        font-size: 13px;
      }
      .row .label {
        color: var(--muted);
      }
      .row .value {
        color: var(--text);
        word-break: break-all;
        text-align: right;
        max-width: 60%;
      }
      .empty {
        color: var(--muted);
        padding: 12px 0;
      }
      #error {
        display: none;
        background: rgba(248, 81, 73, 0.12);
        border: 1px solid var(--red);
        color: var(--red);
        padding: 14px 18px;
        border-radius: 8px;
        margin-bottom: 18px;
        font-size: 13px;
      }
      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid var(--border);
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
      }
      .version-check {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 28px;
      }
      .version-check h2 {
        font-size: 15px;
        margin: 0 0 14px;
      }
      .version-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 14px;
      }
      .version-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .version-label {
        color: var(--muted);
        font-size: 12px;
      }
      .version-value {
        font-size: 14px;
        font-weight: 600;
      }
      .version-match {
        color: var(--green);
      }
      .version-mismatch {
        color: var(--red);
      }
      .version-not-running {
        color: var(--amber);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Dashboard Status Container</h1>
        <div class="sub">
          Sumber: Docker API (<code>GET /containers/json</code>) via proxy unix
          socket
        </div>
      </div>
      <div class="controls">
        <button id="refresh">Muat Ulang</button>
        <span id="status"></span>
      </div>
    </header>

    <main>
      <div id="error"></div>

      <section class="version-check">
        <h2>Deployment Version Check</h2>
        <div class="version-grid">
          <div class="version-item">
            <span class="version-label">Service</span>
            <span class="version-value" id="version-service">-</span>
          </div>
          <div class="version-item">
            <span class="version-label">Expected</span>
            <span class="version-value" id="version-expected">-</span>
          </div>
          <div class="version-item">
            <span class="version-label">Actual</span>
            <span class="version-value" id="version-actual">-</span>
          </div>
          <div class="version-item">
            <span class="version-label">Status</span>
            <span class="version-value" id="version-status">CHECKING</span>
          </div>
        </div>
      </section>

      <div id="groups"></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
