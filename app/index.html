<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Service</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #e6edf3;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 40px 56px;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #3fb950;
      margin-right: 8px;
      box-shadow: 0 0 12px #3fb950;
    }
    h1 { margin: 12px 0 4px; font-size: 24px; }
    .meta { color: #8b949e; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="dot"></span>
    <h1>Service is up</h1>
    <div class="meta">Host: <span id="hostname"></span></div>
  </div>
  <script>
    // Menampilkan hostname container untuk identifikasi visual
    document.getElementById('hostname').textContent = location.hostname || 'unknown';
  </script>
</body>
</html>
