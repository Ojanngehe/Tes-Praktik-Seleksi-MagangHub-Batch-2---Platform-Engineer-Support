# nginx.conf untuk container dashboard.
# Tugas ganda:
#   1. Menyajikan halaman dashboard statis (Soal 1) di "/"
#   2. Meneruskan (proxy) permintaan Docker API ke unix socket Docker
#      sehingga frontend bisa memanggil dengan path yang sama seperti
#      "GET /containers/json" — tanpa masalah CORS (same-origin).
#
# Keamanan: proxy hanya mengizinkan metode GET (read-only), meskipun socket
# docker di-mount sebagai read-write (connect socket butuh rw).
#
# NOTE: worker dijalankan sebagai root agar bisa connect ke unix socket
# /var/run/docker.sock yang dimiliki root:docker di host. Container ini
# khusus untuk fungsi proxy dashboard, jadi aman.
user root;

events {}

http {
  server {
    listen 80;
    server_name _;

    # Dashboard statis
    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # --- Proxy Docker API (read-only) ---
    # Meneruskan endpoint container & image ke unix socket Docker.
    # Contoh: GET /containers/json -> GET /containers/json pada daemon.

    location /containers {
      limit_except GET { deny all; }
      proxy_pass http://unix:/var/run/docker.sock:/containers;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      chunked_transfer_encoding on;
    }

    location /images {
      limit_except GET { deny all; }
      proxy_pass http://unix:/var/run/docker.sock:/images;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
    }

    location /info {
      limit_except GET { deny all; }
      proxy_pass http://unix:/var/run/docker.sock:/info;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
    }
  }
}
